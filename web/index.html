<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SRIT Plus - campus information for Sri Ramakrishna Institute of Technology, Coimbatore.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075BE8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SRIT Plus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SRIT Plus</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (() => {
      const dismissalKey = 'srit-plus-install-dismissed-v2';
      let deferredInstallPrompt = null;
      let installed = false;
      let dismissedInSession = false;

      const notifyFlutter = () => {
        window.dispatchEvent(new Event('srit-install-state-change'));
      };

      const isStandalone = () =>
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true ||
        document.referrer.startsWith('android-app://');

      const browserPlatform = () => {
        const userAgent = window.navigator.userAgent || '';
        const platform =
          window.navigator.userAgentData?.platform ||
          window.navigator.platform ||
          '';

        if (/android/i.test(userAgent)) return 'android';
        const isIPad =
          /iPad/i.test(userAgent) ||
          (platform === 'MacIntel' && window.navigator.maxTouchPoints > 1);
        if (isIPad) return 'ios-tablet';
        if (/iPhone|iPod/i.test(userAgent)) {
          return 'ios';
        }
        return 'desktop';
      };

      window.sritInstallPlatform = browserPlatform;
      window.sritIsStandalone = () => installed || isStandalone();
      window.sritCanPromptInstall = () => deferredInstallPrompt !== null;
      window.sritWasInstallDismissed = () => {
        if (dismissedInSession) return true;
        try {
          return window.localStorage.getItem(dismissalKey) === '1';
        } catch (error) {
          if (error instanceof DOMException && error.name === 'SecurityError') {
            return false;
          }
          throw error;
        }
      };
      window.sritDismissInstall = () => {
        dismissedInSession = true;
        try {
          window.localStorage.setItem(dismissalKey, '1');
        } catch (error) {
          if (
            error instanceof DOMException &&
            ['SecurityError', 'QuotaExceededError'].includes(error.name)
          ) {
            return;
          }
          throw error;
        }
      };
      window.sritPromptInstall = async () => {
        if (!deferredInstallPrompt) return 'unavailable';
        const prompt = deferredInstallPrompt;
        deferredInstallPrompt = null;
        try {
          await prompt.prompt();
          const choice = await prompt.userChoice;
          notifyFlutter();
          return choice.outcome;
        } catch (error) {
          console.error('Could not open the SRIT Plus install prompt:', error);
          notifyFlutter();
          return 'error';
        }
      };

      window.addEventListener('beforeinstallprompt', (event) => {
        if (browserPlatform() !== 'android' || isStandalone()) return;
        event.preventDefault();
        deferredInstallPrompt = event;
        notifyFlutter();
      });

      window.addEventListener('appinstalled', () => {
        installed = true;
        deferredInstallPrompt = null;
        notifyFlutter();
      });

      const standaloneQuery = window.matchMedia('(display-mode: standalone)');
      if (standaloneQuery.addEventListener) {
        standaloneQuery.addEventListener('change', notifyFlutter);
      } else {
        standaloneQuery.addListener(notifyFlutter);
      }

      if (!window.isSecureContext) {
        console.error('SRIT Plus installation requires a secure HTTPS context.');
      } else if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .register('firebase-messaging-sw.js', { scope: '/' })
          .catch((error) => {
            console.error('Could not register the SRIT Plus service worker:', error);
          });
      } else {
        console.error('This browser does not support service workers.');
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
