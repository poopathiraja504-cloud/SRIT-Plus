[[plugins]]
package = "netlify-plugin-flutter"

[plugins.inputs]
channel = "stable"

[build]
command = "flutter build web --release"
publish = "build/web"

[[redirects]]
from = "/downloads/*.apk"
to = "/index.html"
status = 404

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/index.html"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/firebase-messaging-sw.js"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/flutter_bootstrap.js"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/manifest.json"

  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/downloads/app-release.apk"

  [headers.values]
  Content-Type = "application/vnd.android.package-archive"
  Content-Disposition = "attachment"
  Cache-Control = "public, max-age=0, must-revalidate"
